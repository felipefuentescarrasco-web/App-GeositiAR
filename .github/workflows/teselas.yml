# Teselas XYZ de la imagen SkySat 2020 (1 m, carpeta SIG de Drive) recortada al parque → assets/teselas/skysat.
name: Teselas satelitales
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/teselas.yml
      - assets/geo/acta_parque.geojson
permissions:
  contents: write
concurrency:
  group: teselas
  cancel-in-progress: true
jobs:
  teselas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal unrar >/dev/null
      - run: pip install gdown pillow shapely
      - name: Bajar la carpeta de Drive
        run: gdown --folder "https://drive.google.com/drive/folders/$(head -1 tools/sig/carpeta-drive.txt)" -O "$RUNNER_TEMP/sig"
      - name: Descomprimir
        run: |
          cd "$RUNNER_TEMP/sig"
          for r in *.rar; do mkdir -p "${r%.rar}"; unrar x -o+ -idq "$r" "${r%.rar}/" || true; done
          find . -iname 'Skysat3_*utm19s.tif'
      - name: Recortar y teselar
        run: |
          f=$(find "$RUNNER_TEMP/sig" -iname 'Skysat3_*utm19s.tif' | head -1)
          gdalwarp -q -t_srs EPSG:3857 -te -70.6450 -33.4340 -70.5930 -33.3590 -te_srs EPSG:4326 \
            -r bilinear -dstalpha -co TILED=YES "$f" "$RUNNER_TEMP/parque.tif"
          gdal2tiles.py -q --xyz -z 13-17 -w none -r bilinear --processes=4 "$RUNNER_TEMP/parque.tif" "$RUNNER_TEMP/png"
          python3 - "$RUNNER_TEMP/png" assets/teselas/skysat <<'PY'
          import sys, pathlib
          from PIL import Image
          import json, math
          from shapely.geometry import shape, box
          from shapely.ops import unary_union
          src, dst = map(pathlib.Path, sys.argv[1:])
          parque = json.load(open('assets/geo/acta_parque.geojson'))
          zona = unary_union([shape(f['geometry']) for f in parque['features']]).buffer(0.003)  # ~300 m
          def caja(z, x, y):
              n = 2 ** z; lon = lambda x: x / n * 360 - 180
              lat = lambda y: math.degrees(math.atan(math.sinh(math.pi * (1 - 2 * y / n))))
              return box(lon(x), lat(y + 1), lon(x + 1), lat(y))
          n = 0
          for p in src.rglob('*.png'):
              z, x, y = int(p.parent.parent.name), int(p.parent.name), int(p.stem)
              if z >= 15 and not caja(z, x, y).intersects(zona): continue  # lejos del parque
              im = Image.open(p).convert('RGBA')
              if im.getextrema()[3][1] == 0: continue  # tesela vacía
              fondo = Image.new('RGB', im.size, (236, 232, 222)); fondo.paste(im, mask=im.split()[3])
              o = dst / p.relative_to(src).with_suffix('.jpg'); o.parent.mkdir(parents=True, exist_ok=True)
              fondo.save(o, quality=78, optimize=True, progressive=True); n += 1
          print(n, 'teselas')
          lista = sorted(str(o.relative_to(dst).with_suffix('')) for o in dst.rglob('*.jpg'))
          (dst / 'lista.json').write_text(json.dumps(lista, separators=(',', ':')))
          PY
          du -sh assets/teselas/skysat
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -rq --cached assets/teselas/skysat || true
          git add assets/teselas/skysat
          git diff --cached --quiet || git commit -qm "Teselas de la imagen SkySat 2020 del parque"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
